name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected debug APK not found at $APK_PATH"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH exists but is empty or not a regular file."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "ERROR: $APK_PATH does not have .apk extension"; exit 1 ;;
          esac
          echo "Successfully verified debug APK at $APK_PATH ($(wc -c < "$APK_PATH") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi
          SANITIZED_NAME=$(echo "$RAW_REPO_NAME" | tr -c 'a-zA-Z0-9_-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi
          RELEASE_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_DIR=$(mktemp -d -t release-apk-XXXXXX)
          COPIED_APK="${ASSET_DIR}/${RELEASE_FILENAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$COPIED_APK"

          if [ ! -f "$COPIED_APK" ] || [ ! -s "$COPIED_APK" ]; then
            echo "ERROR: Copied release APK asset does not exist or is empty: $COPIED_APK"
            exit 1
          fi

          echo "asset_path=$COPIED_APK" >> $GITHUB_OUTPUT
          echo "asset_name=$RELEASE_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Prepared release asset is missing or empty: $ASSET_FILE"
            exit 1
          fi
          case "$ASSET_FILE" in
            *.apk) ;;
            *) echo "ERROR: Prepared release asset does not have .apk extension: $ASSET_FILE"; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          cat << 'EOF' > release_notes.md
          ### Debug APK Build Information

          - **Build Type:** This is an automatically generated debug APK.
          - **Builder:** The APK was built by GitHub Actions.
          - **GitHub Actions Run Number:** ${{ github.run_number }}
          - **GitHub Actions Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Intended Use:** The APK is intended for testing.
          - **Release Status:** The APK is not a Play Store production release.
          - **Signing Details:** The APK is signed only with a temporary debug keystore.
          EOF
          sed -i "s/\${{ github.run_number }}/${{ github.run_number }}/g" release_notes.md
          sed -i "s/\${{ github.run_attempt }}/${{ github.run_attempt }}/g" release_notes.md
          sed -i "s/\${{ github.sha }}/${{ github.sha }}/g" release_notes.md

          gh release create "$TAG_NAME" "$ASSET_FILE" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$TITLE]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📱 **Download on Android:** Open the [Release Page]($RELEASE_URL) directly on your mobile device and tap **\`$ASSET_NAME\`** under the **Assets** section to download and install." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Backup Actions Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run page." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing did not succeed. The debug APK build and artifact upload succeeded."
            echo "=== APK Build Succeeded (Release Publishing Failed/Skipped) ==="
            echo "The debug APK was built successfully."
            echo "The Actions artifact named app-debug-apk remains available."

            echo "### ⚠️ Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build:** Succeeded ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact:** Succeeded (\`app-debug-apk\`) ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Publishing:** Warning / Incomplete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Download from Artifacts:** You can download the debug APK from the **Artifacts** section on this workflow run page (\`app-debug-apk\`)." >> $GITHUB_STEP_SUMMARY
          fi
